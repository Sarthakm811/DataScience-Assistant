name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: test-key
      KAGGLE_USERNAME: test-user
      KAGGLE_KEY: test-key
      DATABASE_URL: sqlite:///test.db
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        run: |
          cd backend
          # disable the langsmith pytest plugin in CI to prevent external initialization
          pytest -p no:langsmith_plugin -p pytest_asyncio.plugin -p pytest_cov.plugin tests/ -v --cov=app --cov-report=xml:coverage.xml
      
      - name: Upload coverage (if available)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: |
          pip install black flake8 mypy
      
      - name: Run black
        run: black --check backend/
      
      - name: Run flake8
        run: cd backend && flake8 . --config setup.cfg

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend

      - name: Run ESLint
        run: cd frontend && npx eslint .

      - name: Build frontend
        run: npm --prefix frontend run build
